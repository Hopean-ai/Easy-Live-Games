<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Pong · Live Multiplayer Games</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <section id="lobby" hidden>
      <p class="small"><a href="/">All games</a></p>
      <h1>Pong</h1>
      <p class="sub">Two players, one ball, first to 7.</p>
      <p class="small">Playing as <strong id="me-name"></strong><span id="me-guest"> (guest)</span>. <a href="/">Change</a></p>
      <button id="quick">Quick match</button>
      <div id="searching" class="searching" hidden>
        <span>Looking for an opponent…</span>
        <button id="cancel" class="link">Cancel</button>
      </div>
      <button id="create" class="secondary">Create a private room</button>
      <form id="join-form">
        <input id="code" maxlength="12" placeholder="Room code" autocapitalize="characters">
        <button type="submit" class="secondary">Join</button>
      </form>
      <p id="lobby-error" class="error" role="alert"></p>
    </section>

    <section id="play" hidden>
      <header class="bar">
        <span id="left-name" class="pname"></span>
        <span class="score"><span id="left-score">0</span> : <span id="right-score">0</span></span>
        <span id="right-name" class="pname"></span>
      </header>
      <div class="stage">
        <canvas id="canvas" width="800" height="500"></canvas>
        <div id="overlay" class="overlay" hidden>
          <p id="overlay-title"></p>
          <p id="overlay-sub" class="sub"></p>
          <button id="rematch" hidden>Rematch</button>
        </div>
      </div>
      <footer class="bar small">
        <span>Room <strong id="room-code"></strong> <button id="copy" class="link">Copy invite link</button></span>
        <span id="status"></span>
        <button id="requeue" class="link" hidden>Find another opponent</button>
        <span id="ping"></span>
      </footer>
      <section id="skills" class="skills" hidden>
        <header class="bar small">
          <strong id="skill-points"></strong>
          <span id="their-skills"></span>
        </header>
        <div id="tree" class="tree"></div>
        <p class="hint">You earn a skill point each time the other player scores. Press 1–9 or tap to upgrade.</p>
      </section>
      <p class="hint">Move with W/S or the arrow keys. On a phone, touch above or below your paddle.</p>
    </section>
  </main>
  <script type="module" src="/client.js"></script>
</body>
</html>
