<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Multiplayer Games</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="narrow">
    <h1>Live Multiplayer Games</h1>
    <p class="sub">Real-time games against other people, right in the browser.</p>

    <section id="auth" class="stack" hidden>
      <form id="account-form" class="stack">
        <label>Username <input id="username" maxlength="16" autocomplete="username" autocapitalize="off" required></label>
        <label>Password <input id="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required></label>
        <div class="row">
          <button name="mode" value="login">Log in</button>
          <button name="mode" value="register" class="secondary">Create account</button>
        </div>
      </form>
      <p class="divider">or</p>
      <form id="guest-form" class="inline">
        <input id="guest-name" maxlength="16" placeholder="Pick a name" autocomplete="nickname" required>
        <button class="secondary">Play as guest</button>
      </form>
      <p id="auth-error" class="error" role="alert"></p>
    </section>

    <section id="pick" class="stack" hidden>
      <p class="small">
        Playing as <strong id="who"></strong><span id="who-guest"> (guest)</span>.
        <button id="logout" class="link">Log out</button>
      </p>
      <h2>Pick a game</h2>
      <ul id="games" class="games"></ul>
    </section>
  </main>
  <script type="module" src="/home.js"></script>
</body>
</html>
