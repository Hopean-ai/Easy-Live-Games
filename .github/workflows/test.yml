# Runs the tests on every pull request and on main. Among them, test/cfo-moves.test.js fails when a
# web change adds a CFO action without saying how Roblox players get it (see src/cfo/moves.js).
name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
